services:
  web:
    image: nginx:stable-alpine
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    user: "101:101"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 96m
    cpus: 0.5
    ports: ["127.0.0.1:18080:8080"]
    volumes:
      - type: bind
        source: ${SITE_CONTENT:-../dist}
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
  edge:
    profiles: [public]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 192m
    cpus: 0.5
    ports: ["80:80", "443:443"]
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - caddy-data:/data
      - caddy-config:/config
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
volumes:
  caddy-data:
  caddy-config:
