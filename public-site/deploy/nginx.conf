worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    access_log off;
    server_tokens off;
    sendfile on;
    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 20s;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        autoindex off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; script-src 'none'; connect-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        location = / { try_files /index.html =404; }
        location = /index.html { try_files $uri =404; }
        location = /project.html { try_files $uri =404; }
        location = /case.html { try_files $uri =404; }
        location = /privacy.html { try_files $uri =404; }
        location = /style.css { try_files $uri =404; }
        location = /favicon.svg { try_files $uri =404; }
        location = /robots.txt { try_files $uri =404; }
        location = /workbench.png { try_files $uri =404; }
        location = /healthz { default_type text/plain; return 200 "ok\n"; }
        location / { return 404; }
    }
}
